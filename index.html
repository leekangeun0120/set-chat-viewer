<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>셋채팅</title>
<style>
  :root {
    --bg: #b2c7da; --bar: #a9bdce; --me: #fee500; --other: #ffffff;
    --text: #191919; --sub: #4a5866; --line: rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    background: var(--bar); border-bottom: 1px solid var(--line);
  }
  header select {
    flex: 1; min-width: 0; font-size: 16px; font-weight: 700;
    background: transparent; border: 0; color: var(--text);
  }
  header button { background: none; border: 0; font-size: 20px; cursor: pointer; padding: 4px; }
  #status { font-size: 12px; color: var(--sub); text-align: center; padding: 4px; min-height: 20px; }
  main { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
  .day {
    text-align: center; margin: 14px 0 8px;
  }
  .day span {
    font-size: 12px; color: #fff; background: rgba(0,0,0,.18);
    padding: 4px 12px; border-radius: 12px;
  }
  .row { display: flex; gap: 8px; margin: 6px 0; align-items: flex-start; }
  .row.me { justify-content: flex-end; }
  .avatar {
    width: 38px; height: 38px; border-radius: 14px; flex: none;
    display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px;
  }
  .who { font-size: 13px; color: var(--sub); margin: 0 0 4px 2px; }
  .line { display: flex; align-items: flex-end; gap: 5px; }
  .row.me .line { flex-direction: row-reverse; }
  .bubble {
    max-width: min(72vw, 420px); padding: 8px 11px; border-radius: 14px;
    background: var(--other); font-size: 15px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word;
  }
  .row.me .bubble { background: var(--me); }
  .bubble.intro { background: #eef3f7; font-size: 13px; color: var(--sub); }
  .time { font-size: 11px; color: var(--sub); white-space: nowrap; }
  footer {
    display: flex; gap: 8px; padding: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    background: #fff; border-top: 1px solid var(--line);
  }
  footer textarea {
    flex: 1; resize: none; height: 40px; max-height: 120px; font: inherit; font-size: 15px;
    border: 0; outline: none; padding: 9px 4px;
  }
  footer button {
    background: var(--me); border: 0; border-radius: 8px; padding: 0 16px;
    font-weight: 700; font-size: 15px; cursor: pointer;
  }
  footer button:disabled { opacity: .5; }
  dialog { border: 0; border-radius: 14px; padding: 18px; width: min(92vw, 380px); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h2 { margin: 0 0 12px; font-size: 18px; }
  dialog label { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
  dialog input, dialog select {
    width: 100%; font-size: 15px; padding: 9px; border: 1px solid #ccd; border-radius: 8px;
  }
  dialog p { font-size: 12px; color: var(--sub); line-height: 1.5; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .actions button { padding: 8px 16px; border-radius: 8px; border: 0; font-size: 15px; cursor: pointer; }
  .actions .ok { background: var(--me); font-weight: 700; }
</style>
</head>
<body>
<header>
  <select id="room" aria-label="방 고르기"><option>방 불러오는 중…</option></select>
  <button id="refresh" title="새로고침" aria-label="새로고침">↻</button>
  <button id="openSettings" title="설정" aria-label="설정">⚙️</button>
</header>
<div id="status"></div>
<main id="chat"></main>
<footer>
  <textarea id="msg" placeholder="메시지 입력"></textarea>
  <button id="send">전송</button>
</footer>

<dialog id="settings">
  <h2>설정</h2>
  <label for="repo">저장소 (아이디/저장소)</label>
  <input id="repo" placeholder="예: myid/set-chat" autocomplete="off">
  <label for="token">GitHub 토큰 (Issues 읽기·쓰기)</label>
  <input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
  <label for="me">나는</label>
  <select id="me">
    <option>강은</option><option>클로드코드</option><option>피클</option>
  </select>
  <p>토큰은 이 브라우저에만 저장되고 api.github.com 말고는 어디로도 보내지 않아요.</p>
  <div class="actions">
    <button id="cancel">닫기</button>
    <button id="save" class="ok">저장</button>
  </div>
</dialog>

<script>
const MEMBERS = {
  "강은":     { color: "#f28b54" },
  "클로드코드": { color: "#c96442" },
  "피클":     { color: "#6aa84f" },
};
const TAG = /^\s*\*{0,2}\[(강은|클로드코드|피클)\]\*{0,2}\s*\n?/;
const POLL_MS = 20000;

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem("setchat." + k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem("setchat." + k, v); } catch {} },
};
let cfg = { repo: store.get("repo"), token: store.get("token"), me: store.get("me") || "강은" };
let lastSig = "";

function status(t) { $("status").textContent = t || ""; }

async function gh(path, opts = {}) {
  const res = await fetch("https://api.github.com" + path, {
    ...opts,
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + cfg.token,
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.body ? { "Content-Type": "application/json" } : {}),
    },
  });
  if (!res.ok) throw new Error(res.status + " " + (await res.text()).slice(0, 120));
  return res.json();
}

async function ghAll(path) {
  let out = [], page = 1;
  while (true) {
    const sep = path.includes("?") ? "&" : "?";
    const batch = await gh(`${path}${sep}per_page=100&page=${page}`);
    out = out.concat(batch);
    if (batch.length < 100) return out;
    page++;
  }
}

function parse(body) {
  body = body || "";
  const m = body.match(TAG);
  return m ? { who: m[1], text: body.slice(m[0].length).trim() } : { who: null, text: body.trim() };
}

const dayFmt = new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
const timeFmt = new Intl.DateTimeFormat("ko-KR", { hour: "numeric", minute: "2-digit" });

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function render(issue, comments) {
  const chat = $("chat");
  const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
  chat.replaceChildren();
  let lastDay = "";

  const items = [];
  if (issue.body && issue.body.trim()) items.push({ ...parse(issue.body), at: issue.created_at, login: issue.user.login, intro: true });
  for (const c of comments) items.push({ ...parse(c.body), at: c.created_at, login: c.user.login });

  for (const it of items) {
    const d = new Date(it.at);
    const day = dayFmt.format(d);
    if (day !== lastDay) {
      const sep = el("div", "day"); sep.append(el("span", null, day)); chat.append(sep);
      lastDay = day;
    }
    const who = it.who || it.login;
    const mine = it.who === cfg.me;
    const row = el("div", "row" + (mine ? " me" : ""));
    if (!mine) {
      const av = el("div", "avatar", who.slice(0, 1));
      av.style.background = (MEMBERS[who] || { color: "#8a9aa9" }).color;
      row.append(av);
    }
    const col = el("div");
    if (!mine) col.append(el("div", "who", who));
    const line = el("div", "line");
    line.append(el("div", "bubble" + (it.intro ? " intro" : ""), it.text || "(빈 메시지)"));
    line.append(el("span", "time", timeFmt.format(d)));
    col.append(line);
    row.append(col);
    chat.append(row);
  }
  if (atBottom || !lastSig) chat.scrollTop = chat.scrollHeight;
}

async function loadRooms() {
  const issues = await ghAll(`/repos/${cfg.repo}/issues?state=all`);
  const rooms = issues.filter(i => !i.pull_request && i.title.startsWith("[단톡방]"));
  const sel = $("room");
  const keep = sel.value || store.get("room");
  sel.replaceChildren();
  for (const r of rooms) {
    const o = el("option", null, r.title.replace("[단톡방]", "").trim() + (r.state === "closed" ? " (닫힘)" : ""));
    o.value = r.number;
    sel.append(o);
  }
  if (!rooms.length) { sel.append(el("option", null, "방이 없어요")); return; }
  if (rooms.some(r => String(r.number) === keep)) sel.value = keep;
}

async function loadChat() {
  const n = $("room").value;
  if (!n || isNaN(n)) return;
  const [issue, comments] = await Promise.all([
    gh(`/repos/${cfg.repo}/issues/${n}`),
    ghAll(`/repos/${cfg.repo}/issues/${n}/comments`),
  ]);
  const sig = n + ":" + comments.length + ":" + (comments.at(-1)?.updated_at || "");
  if (sig !== lastSig) { render(issue, comments); lastSig = sig; }
  status("");
}

async function refresh(all) {
  if (!cfg.repo || !cfg.token) { status("⚙️ 설정에서 저장소와 토큰을 넣어 주세요"); return; }
  try {
    if (all) await loadRooms();
    await loadChat();
  } catch (e) { status("불러오기 실패: " + e.message); }
}

let sending = false;
async function send() {
  if (sending) return;
  const text = $("msg").value.trim();
  const n = $("room").value;
  if (!text || !n || isNaN(n)) return;
  sending = true;
  $("send").disabled = true;
  try {
    await gh(`/repos/${cfg.repo}/issues/${n}/comments`, {
      method: "POST",
      body: JSON.stringify({ body: `**[${cfg.me}]**\n\n${text}` }),
    });
    $("msg").value = "";
    lastSig = "";
    await loadChat();
    $("chat").scrollTop = $("chat").scrollHeight;
  } catch (e) { status("전송 실패: " + e.message); }
  $("send").disabled = false;
  sending = false;
}

$("room").addEventListener("change", () => { store.set("room", $("room").value); lastSig = ""; refresh(false); });
$("refresh").addEventListener("click", () => { lastSig = ""; refresh(true); });
$("send").addEventListener("click", send);
// 엔터 = 전송, Shift+엔터 = 줄바꿈. 한글 조합 중 엔터도 한 번에 전송되게 조합이 끝난 뒤 보낸다.
let sendAfterCompose = false;
$("msg").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.keyCode !== 229) return;
  if (e.shiftKey) return;
  if (e.isComposing || e.keyCode === 229) {
    if (e.key === "Enter" || e.code === "Enter" || e.code === "NumpadEnter") sendAfterCompose = true;
    return;
  }
  e.preventDefault();
  send();
});
$("msg").addEventListener("compositionend", () => {
  if (!sendAfterCompose) return;
  sendAfterCompose = false;
  setTimeout(send, 0);
});
$("openSettings").addEventListener("click", () => {
  $("repo").value = cfg.repo; $("token").value = cfg.token; $("me").value = cfg.me;
  $("settings").showModal();
});
$("cancel").addEventListener("click", () => $("settings").close());
$("save").addEventListener("click", () => {
  cfg = { repo: $("repo").value.trim(), token: $("token").value.trim(), me: $("me").value };
  store.set("repo", cfg.repo); store.set("token", cfg.token); store.set("me", cfg.me);
  $("settings").close(); lastSig = ""; refresh(true);
});

refresh(true);
setInterval(() => { if (!document.hidden) refresh(false); }, POLL_MS);
if (!cfg.repo || !cfg.token) $("openSettings").click();
</script>
</body>
</html>
